name: Runner Ollama Remediate

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "diagnose = read-only inspection; remediate = free port 11435 and restart managed ollama"
        required: true
        default: "diagnose"
        type: choice
        options:
          - diagnose
          - remediate
      ollama_bin:
        description: "Ollama binary to start in remediate mode (empty = first known candidate)"
        required: false
        default: ""
        type: string
      port:
        description: "Managed Ollama port"
        required: false
        default: "11435"
        type: string

permissions:
  contents: read

jobs:
  remediate:
    runs-on: [self-hosted, Linux, X64, 3090, local-ai]
    steps:
      - name: Diagnose port and ollama state
        run: |
          PORT="${{ github.event.inputs.port }}"
          echo "=== listeners on ${PORT} / 11434 ==="
          ss -ltnp | grep -E ":(${PORT}|11434) " || echo "no listeners"
          echo "=== ollama-ish processes ==="
          ps -eo pid,ppid,user,etime,args | grep -iE "ollama|${PORT}" | grep -v grep || true
          echo "=== listener process details ==="
          for pid in $(ss -ltnp | grep ":${PORT} " | grep -oP 'pid=\K[0-9]+' | sort -u); do
            echo "--- pid ${pid} ---"
            tr '\0' ' ' < "/proc/${pid}/cmdline"; echo
            readlink "/proc/${pid}/exe" || true
            ps -o pid,ppid,user,lstart,args -p "${pid}" || true
          done
          echo "=== ollama binaries ==="
          for bin in /usr/local/bin/ollama /usr/bin/ollama "${HOME}/ollama" "${HOME}/bin/ollama"; do
            if [ -x "${bin}" ]; then
              echo "${bin} -> $("${bin}" --version 2>&1 | head -n 2)"
            fi
          done
          find "${HOME}" -maxdepth 3 -type f -name 'ollama*' -executable 2>/dev/null | head -n 10
          echo "=== systemd ollama ==="
          systemctl is-active ollama || true
          echo "=== user systemd availability ==="
          export XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}"
          systemctl --user is-system-running 2>&1 || true
          echo "=== previous remediate serve log ==="
          tail -n 25 "${HOME}/ollama-serve-remediate.log" 2>/dev/null || echo "no log"
          echo "=== api probe ==="
          curl -s --max-time 5 "http://127.0.0.1:${PORT}/api/version" || echo "no api response"

      - name: Free port and restart managed ollama
        if: github.event.inputs.mode == 'remediate'
        run: |
          set -euo pipefail
          PORT="${{ github.event.inputs.port }}"
          BIN_INPUT="${{ github.event.inputs.ollama_bin }}"

          # Kill only non-ollama listeners squatting on the managed port.
          mapfile -t squatters < <(ss -ltnp | grep ":${PORT} " | grep -v '"ollama"' | grep -oP 'pid=\K[0-9]+' | sort -u)
          for pid in "${squatters[@]}"; do
            [ -n "${pid}" ] || continue
            echo "killing non-ollama listener pid=${pid} cmd=$(tr '\0' ' ' < /proc/${pid}/cmdline)"
            kill "${pid}" || true
          done
          sleep 3
          for pid in "${squatters[@]}"; do
            [ -n "${pid}" ] || continue
            if kill -0 "${pid}" 2>/dev/null; then
              echo "force killing pid=${pid}"
              kill -9 "${pid}" || true
            fi
          done

          # Stop stale ollama serve instances so exactly one managed instance remains.
          pkill -f 'ollama serve' || true
          sleep 3

          if ss -ltn | grep -q ":${PORT} "; then
            echo "::error::port ${PORT} still occupied after cleanup"
            ss -ltnp | grep ":${PORT} " || true
            exit 1
          fi

          # Record systemd unit config for the ops trail.
          echo "=== systemd unit (informational) ==="
          cat /etc/systemd/system/ollama.service 2>/dev/null || true
          cat /etc/systemd/system/ollama.service.d/override.conf 2>/dev/null || true

          # If a newer ollama tarball was staged in home, extract and consider it.
          TARBALL="${HOME}/ollama-linux-amd64.tar.zst"
          if [ -f "${TARBALL}" ]; then
            EXTRACT_DIR="${HOME}/ollama-remediate"
            mkdir -p "${EXTRACT_DIR}"
            tar --use-compress-program=unzstd -xf "${TARBALL}" -C "${EXTRACT_DIR}" || tar -xf "${TARBALL}" -C "${EXTRACT_DIR}" || true
            find "${EXTRACT_DIR}" -maxdepth 3 -type f -name ollama -executable 2>/dev/null || true
          fi

          version_of() {
            "$1" --version 2>/dev/null | grep -oP '[0-9]+\.[0-9]+\.[0-9]+' | head -n 1 || true
          }

          # Pick the ollama binary: explicit input wins, otherwise newest known candidate.
          if [ -n "${BIN_INPUT}" ]; then
            OLLAMA_BIN="${BIN_INPUT}"
          else
            OLLAMA_BIN=""
            BEST_VER=""
            for cand in /usr/local/bin/ollama /usr/bin/ollama "${HOME}/ollama" "${HOME}/bin/ollama" "${HOME}/ollama-remediate/bin/ollama" "${HOME}/ollama-remediate/ollama"; do
              if [ -x "${cand}" ]; then
                ver="$(version_of "${cand}")"
                echo "candidate ${cand} version=${ver:-unknown}"
                if [ -n "${ver}" ] && { [ -z "${BEST_VER}" ] || [ "$(printf '%s\n%s\n' "${BEST_VER}" "${ver}" | sort -V | tail -n 1)" = "${ver}" ]; }; then
                  BEST_VER="${ver}"
                  OLLAMA_BIN="${cand}"
                fi
              fi
            done
          fi
          if [ -z "${OLLAMA_BIN}" ]; then
            echo "::error::no ollama binary found"
            exit 1
          fi
          echo "using ollama binary: ${OLLAMA_BIN} ($("${OLLAMA_BIN}" --version 2>&1 | head -n 1))"

          export OLLAMA_MODELS="${OLLAMA_MODELS:-/mnt/d/Ollama}"

          # systemd-managed start survives the runner's job-cgroup cleanup;
          # a plain nohup child of the step gets killed when the job ends.
          if sudo -n true 2>/dev/null; then
            echo "sudo available: managing ollama via systemd for durability"
            UNIT=/etc/systemd/system/ollama.service
            OVERRIDE_DIR=/etc/systemd/system/ollama.service.d
            OVERRIDE=${OVERRIDE_DIR}/override.conf
            sudo mkdir -p "${OVERRIDE_DIR}"
            if sudo test -f "${OVERRIDE}" && sudo grep -q 'OLLAMA_HOST=' "${OVERRIDE}"; then
              sudo sed -i "s/OLLAMA_HOST=[^\"]*/OLLAMA_HOST=127.0.0.1:${PORT}/" "${OVERRIDE}"
            else
              echo "Environment=\"OLLAMA_HOST=127.0.0.1:${PORT}\"" | sudo tee -a "${OVERRIDE}"
            fi
            if ! sudo grep -q "^ExecStart=${OLLAMA_BIN} serve" "${UNIT}"; then
              sudo sed -i "s|^ExecStart=.*ollama serve.*|ExecStart=${OLLAMA_BIN} serve|" "${UNIT}" || true
            fi
            echo "=== effective unit config ==="
            sudo cat "${UNIT}" || true
            sudo cat "${OVERRIDE}" || true
            sudo systemctl daemon-reload
            sudo systemctl enable ollama || true
            sudo systemctl restart ollama
            sleep 3
            systemctl status ollama --no-pager -l | head -n 15 || true
          else
            echo "::warning::sudo unavailable: falling back to setsid, may not survive runner cleanup"
            export OLLAMA_HOST="127.0.0.1:${PORT}"
            setsid nohup "${OLLAMA_BIN}" serve > "${HOME}/ollama-serve-remediate.log" 2>&1 < /dev/null &
            echo "started ollama serve pid=$!"
          fi

          for attempt in 1 2 3 4 5 6; do
            sleep 5
            if curl -s --max-time 5 "http://127.0.0.1:${PORT}/api/version"; then
              echo
              break
            fi
            if [ "${attempt}" = "6" ]; then
              echo "::error::ollama did not come up on ${PORT}"
              tail -n 30 "${HOME}/ollama-serve-remediate.log" || true
              exit 1
            fi
          done

          echo "=== post-remediate state ==="
          ss -ltnp | grep ":${PORT} " || true
          ps -eo pid,ppid,user,etime,args | grep -i 'ollama serve' | grep -v grep || true
